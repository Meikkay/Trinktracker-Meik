<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mein Trinktracker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #12344d;
      background: linear-gradient(135deg, #b8e7ff, #e9f9ff, #90d7f7);
      background-size: 300% 300%;
      animation: hintergrund 10s ease infinite;
    }

    @keyframes hintergrund {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    .app {
      width: 100%;
      max-width: 430px;
      padding: 32px;
      text-align: center;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 28px;
      box-shadow: 0 18px 45px rgba(24, 113, 160, 0.25);
    }

    .tropfen {
      display: inline-block;
      font-size: 72px;
      animation: schweben 2.5s ease-in-out infinite;
    }

    @keyframes schweben {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    h1 {
      margin: 10px 0 6px;
      font-size: 32px;
    }

    .untertitel {
      margin: 0 0 24px;
      color: #52758c;
    }

    .anzeige {
      margin: 20px 0;
      padding: 24px;
      background: linear-gradient(145deg, #edfaff, #dff4ff);
      border-radius: 20px;
    }

    #glaeser {
      margin: 0;
      font-size: 56px;
      font-weight: bold;
      color: #087fc0;
    }

    .bezeichnung {
      margin: 4px 0;
      font-size: 18px;
    }

    #menge {
      margin: 8px 0 0;
      font-size: 22px;
      font-weight: bold;
    }

    .zielzeile {
      display: flex;
      justify-content: space-between;
      margin-top: 24px;
      font-size: 14px;
      color: #52758c;
    }

    .fortschritt-aussen {
      height: 18px;
      margin-top: 8px;
      overflow: hidden;
      background: #cfe7f2;
      border-radius: 20px;
    }

    #fortschritt {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #13a8e3, #087fc0);
      border-radius: 20px;
      transition: width 0.5s ease;
    }

    #nachricht {
      min-height: 48px;
      margin: 20px 0;
      padding: 12px;
      font-weight: bold;
      color: #075d8d;
      background: #eefaff;
      border-radius: 12px;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 17px;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    .hinzufuegen {
      color: white;
      background: linear-gradient(135deg, #10a6e0, #087fc0);
      box-shadow: 0 7px 18px rgba(8, 127, 192, 0.3);
    }

    .zuruecksetzen {
      color: #31536a;
      background: #e5f1f6;
    }

    .hinweis {
      margin: 20px 0 0;
      font-size: 13px;
      color: #6c8798;
    }
  </style>
</head>

<body>

  <main class="app">
    <div class="tropfen">💧</div>

    <h1>Mein Trinktracker</h1>

    <p class="untertitel">
      Ein Glas entspricht 500 Millilitern.
    </p>

    <section class="anzeige">
      <p id="glaeser">0</p>
      <p class="bezeichnung">Gläser heute</p>
      <p id="menge">0 Milliliter</p>

      <div class="zielzeile">
        <span>Tagesfortschritt</span>
        <span id="prozent">0 %</span>
      </div>

      <div
        class="fortschritt-aussen"
        role="progressbar"
        aria-label="Tagesfortschritt"
        aria-valuemin="0"
        aria-valuemax="100"
      >
        <div id="fortschritt"></div>
      </div>
    </section>

    <p id="nachricht">
      Starte mit deinem ersten Glas Wasser.
    </p>

    <button class="hinzufuegen" onclick="glasHinzufuegen()">
      💧 500 ml hinzufügen
    </button>

    <button class="zuruecksetzen" onclick="tagZuruecksetzen()">
      Tagesstand zurücksetzen
    </button>

    <p class="hinweis">
      Tagesziel: 2.000 Milliliter
    </p>
  </main>

  <script>
    // Feste Werte für diese Version
    const glasgroesse = 500;
    const tagesziel = 2000;

    // Gespeicherten Tagesstand laden
    let anzahlGlaeser =
      Number(localStorage.getItem("anzahlGlaeser")) || 0;

    // Anzeige und Fortschrittsbalken aktualisieren
    function anzeigeAktualisieren() {
      const menge = anzahlGlaeser * glasgroesse;
      const prozent = Math.min(
        Math.round((menge / tagesziel) * 100),
        100
      );

      document.getElementById("glaeser").textContent =
        anzahlGlaeser;

      document.getElementById("menge").textContent =
        menge + " Milliliter";

      document.getElementById("prozent").textContent =
        prozent + " %";

      document.getElementById("fortschritt").style.width =
        prozent + "%";

      localStorage.setItem("anzahlGlaeser", anzahlGlaeser);

      nachrichtAktualisieren(menge);
    }

    // Passende Motivation anzeigen
    function nachrichtAktualisieren(menge) {
      const nachricht = document.getElementById("nachricht");

      if (menge === 0) {
        nachricht.textContent =
          "Starte mit deinem ersten Glas Wasser.";
      } else if (menge < 1000) {
        nachricht.textContent =
          "Guter Anfang – bleib dran!";
      } else if (menge < 2000) {
        nachricht.textContent =
          "Halbzeit geschafft!";
      } else {
        nachricht.textContent =
          "🎉 Tagesziel erreicht – sehr gut!";
      }
    }

    // Ein Glas hinzufügen
    function glasHinzufuegen() {
      anzahlGlaeser++;
      anzeigeAktualisieren();
    }

    // Tagesstand auf null setzen
    function tagZuruecksetzen() {
      anzahlGlaeser = 0;
      anzeigeAktualisieren();
    }

    anzeigeAktualisieren();
  </script>

</body>
</html>
